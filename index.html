<!DOCTYPE html>
<html lang="en" data-app="markdown-mate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Markdown Mate</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2A7F7F">
  <meta name="description" content="Read markdown files beautifully. Open any .md file and see it rendered instantly - no editor, no accounts, no clutter.">
  <meta property="og:title" content="Markdown Mate">
  <meta property="og:description" content="A lightweight .md file reader. Open a markdown file and see a clean rendered preview instantly.">
  <meta property="og:type" content="website">
</head>
<body>

  <!-- Landing: shown when no file is open -->
  <div class="landing" id="js-landing">
    <div class="landing__card">
      <img src="icon.svg" width="56" height="56" alt="" class="landing__icon" aria-hidden="true">
      <h1 class="landing__title">Markdown Mate</h1>
      <p class="landing__desc">Open a <code class="inline-code">.md</code> file and read it beautifully.</p>
      <button class="btn btn--primary btn--lg" id="js-open-landing">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Open file
      </button>
      <p class="landing__note">Works in Chrome and Edge &middot; Files stay on your computer</p>
      <p class="landing__unsupported" id="js-unsupported" hidden>
        Your browser doesn't support the File System Access API. Try Chrome or Edge.
      </p>
    </div>
  </div>

  <!-- Reader: shown when a file is open -->
  <div class="reader" id="js-reader" hidden>

    <header class="toolbar">
      <div class="toolbar__brand">
        <img src="icon.svg" width="26" height="26" alt="Markdown Mate" class="toolbar__logo">
        <span class="toolbar__name">Markdown Mate</span>
      </div>

      <div class="toolbar__file" id="js-file-badge" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
        <span id="js-filename" class="toolbar__filename"></span>
      </div>

      <div class="toolbar__spacer"></div>

      <button class="btn btn--primary btn--sm" id="js-open-toolbar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Open file
      </button>
    </header>

    <main class="content">
      <article class="doc" id="js-doc" aria-label="Rendered document"></article>
    </main>

    <footer class="footer">
      Built by Adam Baker &middot; Build with Baker
    </footer>

  </div>

  <!-- Error toast -->
  <div class="toast" id="js-toast" role="alert" aria-live="assertive" hidden>
    <span id="js-toast-msg"></span>
  </div>

  <!--
    Dependencies vendored locally for offline PWA support.
    Source URLs (re-fetch if updating versions):
      vendor/highlight.min.js     - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js
      vendor/marked.min.js        - https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js
      vendor/purify.min.js        - https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js
      vendor/github.min.css       - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css
      vendor/github-dark.min.css  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css
  -->
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js" defer></script>

</body>
</html>
